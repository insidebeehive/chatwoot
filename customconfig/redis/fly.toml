app = "chatwoot-redis-self"
primary_region = "sin"

# Dedicated single-node Redis for Chatwoot (chatwoot-beehive).
# noeviction + AOF persistence so Sidekiq never silently drops queued jobs.
# Internal-only: reachable from chatwoot-beehive at chatwoot-redis-self.internal:6379

[build]
  image = "redis:7.4-alpine"

[[mounts]]
  source = "chatwoot_redis_data"
  destination = "/data"

# Dedicated CPU. On shared-cpu-1x this machine ran with ~67% steal time
# (more time waiting for CPU than executing), which spiked command latency
# past the 1s client timeout and cascaded into Sidekiq job-fetch failures,
# $alfred pool exhaustion and 15s rack-timeout 500s in chatwoot-beehive.
[[vm]]
  memory = "2gb"
  cpu_kind = "performance"
  cpus = 1

[processes]
  app = "sh -c 'exec redis-server --appendonly yes --maxmemory-policy noeviction --maxmemory 400mb --dir /data --requirepass \"$REDIS_PASSWORD\"'"
