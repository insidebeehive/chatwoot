app = "chatwoot-beehive"
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = 5


# dockerfile = "DockerfileCache"
# image = "chatwoot/chatwoot:latest"
[build]
  dockerfile = "DockerfileCache"

[env]
  PORT = "3000"
  ACTIVE_STORAGE_SERVICE="amazon"
  S3_FORCE_PATH_STYLE="true"
  STORAGE_BUCKET_NAME="chatwoot-insidebeehive"
  STORAGE_FORCE_PATH_STYLE="true"
  AWS_REGION="ap-southeast-1"
  INSTALLATION_ENV="self_hosted"
  CHATWOOT_INSTALLATION_TYPE="self_hosted"
  FRONTEND_URL="https://chatwoot-beehive.fly.dev"
  ENABLE_RACK_ATTACK = "true"
  WEB_CONCURRENCY = "2"
  RAILS_MAX_THREADS = "5"
  # Agent inbox renders ~6 queries per conversation (N+1 in the conversation
  # partial), so page size drives request cost linearly. 15 keeps the inbox
  # responsive until that N+1 is fixed.
  CONVERSATION_RESULTS_PER_PAGE = "15"

# ENABLE_ACCOUNT_SIGNUP=true
[http_service]
  internal_port = 3000
  force_https = true
  # Do not suspend app machines. Suspend freezes the Puma process with its
  # Redis/Postgres sockets open; on resume those sockets are dead and reads
  # block until they time out, which surfaced as multi-second stalls and
  # 15s rack-timeout 500s. Live chat + persistent WebSockets make the idle
  # savings not worth the wake latency.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 4
  processes = ["app"]

[[statics]]
  guest_path = "/app/public"
  url_prefix = "/public"

[processes]
  app = "bundle exec rails server -b 0.0.0.0"
  sidekiq = "bundle exec sidekiq -C config/sidekiq.yml"

[[vm]]
  size = "performance-2x"
  processes = ["app"]

[[vm]]
  size = "performance-1x"
  processes = ["sidekiq"]

[deploy]
release_command="/bin/sh customconfig/post-deploy.sh"

